name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: npm ci

      - name: Unit + integration tests
        run: npm run test:all

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/quaver
      JWT_SECRET: ci-playwright-secret-key
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install quaver-tests deps
        working-directory: quaver-tests
        run: npm ci

      - name: Install Playwright (chromium)
        working-directory: quaver-tests
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: quaver-tests
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: quaver-tests/playwright-report
          retention-days: 7
