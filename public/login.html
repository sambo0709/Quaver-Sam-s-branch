<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Quaver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav>
    <!-- Left: Logo -->
    <div class="nav-left">
      <a href="Index.html">
        <img class="logo" id="logo" src="quaver_nightmode1.png" alt="Quaver">
      </a>
    </div>

    <div class="nav-right"></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-box">
      <div class="auth-title">Quaver</div>
      <div class="auth-subtitle">Sign in to save your playlists</div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('register')">Register</button>
      </div>
      <div id="error-msg" class="auth-error"></div>
      <div id="success-msg" class="auth-success"></div>
      <div id="login-form">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="••••••••"/>
        </div>
        <button class="auth-submit" onclick="login()">Sign In</button>
      </div>
      <div id="register-form" style="display:none">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="cooluser123"/>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="reg-password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="10 characters minimum"/>
        </div>
        <button class="auth-submit" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    function applyTheme(theme) {
      const active = theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme;
      document.documentElement.setAttribute('data-theme', active);
      document.getElementById('logo').src = active === 'light' ? 'quaver_lightmode1.png' : 'quaver_nightmode1.png';
    }

    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function() {
      if (!localStorage.getItem('theme')) applyTheme('system');
    });

    window.addEventListener('DOMContentLoaded', async function() {
      applyTheme(localStorage.getItem('theme') || 'system');
      localStorage.removeItem('quaver_token');
      try {
        const res = await fetch(API + '/api/auth/me', { credentials: 'include' });
        if (res.ok) window.location.href = 'Index.html';
      } catch (_) {}
    });

    function showTab(tab) {
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.querySelectorAll('.auth-tab').forEach(function(t, i) {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      showError(''); showSuccess('');
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) { showError('Please fill in all fields.'); return; }
      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        localStorage.setItem('quaver_user', JSON.stringify({ username: data.username, email: data.email }));
        showSuccess('Logged in! Redirecting...');
        setTimeout(function() { window.location.href = 'Index.html'; }, 1000);
      } catch (err) {
        showError('Could not connect to server.');
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !email || !password) { showError('Please fill in all fields.'); return; }
      try {
        const res = await fetch(API + '/api/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        localStorage.setItem('quaver_user', JSON.stringify({ username: data.username, email: data.email }));
        showSuccess('Account created! Redirecting...');
        setTimeout(function() { window.location.href = 'Index.html'; }, 1000);
      } catch (err) {
        showError('Could not connect to server.');
      }
    }
  </script>
</body>
</html>
