<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Quaver</title>
  <link rel="icon" type="image/svg+xml" href="quaver-logo-cyan.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="top-nav" aria-label="Primary navigation">
    <!-- Left: Logo -->
    <div class="nav-left">
      <a href="Index.html">
        <img class="logo" id="logo" src="quaver-logo-cyan.svg" alt="Quaver">
      </a>
    </div>

    <div class="nav-right"></div>
  </nav>

  <div class="auth-wrap">
    <div class="auth-box">
      <h1 class="auth-title">Quaver</h1>
      <div class="auth-subtitle">Sign in to save your playlists</div>
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showTab('login')">Login</button>
        <button class="auth-tab" onclick="showTab('register')">Register</button>
      </div>
      <div id="error-msg" class="auth-error"></div>
      <div id="success-msg" class="auth-success"></div>
      <div id="login-form">
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••"/>
        </div>
        <button class="auth-submit" onclick="login()">Sign In</button>
      </div>
      <div id="register-form" style="display:none">
        <div class="auth-field">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="cooluser123"/>
        </div>
        <div class="auth-field">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="reg-password" minlength="10" maxlength="128" autocomplete="new-password" placeholder="10 characters minimum"/>
        </div>
        <label class="auth-consent"><input type="checkbox" id="reg-consent" required/> I agree to Quaver's <a href="terms.html" target="_blank">Terms</a> and acknowledge the <a href="privacy.html" target="_blank">Privacy Policy</a>.</label>
        <button class="auth-submit" onclick="register()">Create Account</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="site-footer-main">
      <div class="site-footer-brand"><a href="Index.html" aria-label="Quaver home"><span class="site-footer-mark" aria-hidden="true"><img class="theme-logo-dark" src="quaver-logo-cyan.svg" alt=""><img class="theme-logo-light" src="quaver-logo-orange.svg" alt=""></span>Quaver</a><p>Music shaped around how you feel.</p></div>
      <div class="site-footer-links">
        <section><h2>Discover</h2><a href="search.html">Search</a><a href="discover.html">Daily discovery</a><a href="Index.html#trending-section">Trending moods</a><a href="archive.html">Mood archive</a></section>
        <section><h2>Your library</h2><a href="playlists.html">Playlists</a><a href="profile.html">Profile</a><a href="settings.html">Settings</a></section>
        <section><h2>Quaver</h2><a href="Index.html#recommendation-form">Create a mood mix</a><a href="settings.html#spotify-settings">Spotify connection</a></section>
      </div>
    </div>
    <div class="site-footer-bottom"><span class="site-footer-legal"><span>© 2026 Quaver</span><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="support.html">Support</a></span><span>Music playback powered by <a href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a></span></div>
  </footer>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
    function applyTheme(theme) {
      const active = theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme;
      document.documentElement.setAttribute('data-theme', active);
      document.getElementById('logo').src = active === 'light' ? 'quaver-logo-orange.svg' : 'quaver-logo-cyan.svg';
    }

    matchMedia('(prefers-color-scheme: light)').addEventListener('change', function() {
      if (localStorage.getItem('theme') === 'system') applyTheme('system');
    });

    window.addEventListener('DOMContentLoaded', async function() {
      applyTheme(localStorage.getItem('theme') || 'dark');
      localStorage.removeItem('quaver_token');
      try {
        const res = await fetch(API + '/api/auth/me', { credentials: 'include' });
        if (res.ok) window.location.href = 'Index.html';
      } catch (_) {}
    });

    function showTab(tab) {
      document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
      document.querySelectorAll('.auth-tab').forEach(function(t, i) {
        t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'register' && i === 1));
      });
      showError(''); showSuccess('');
    }

    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('success-msg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    async function login() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) { showError('Please fill in all fields.'); return; }
      try {
        const res = await fetch(API + '/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        localStorage.setItem('quaver_user', JSON.stringify({ username: data.username, email: data.email }));
        showSuccess('Logged in! Redirecting...');
        setTimeout(function() { window.location.href = 'Index.html'; }, 1000);
      } catch (err) {
        showError('Could not connect to server.');
      }
    }

    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const consent = document.getElementById('reg-consent').checked;
      if (!username || !email || !password) { showError('Please fill in all fields.'); return; }
      if (!consent) { showError('Agree to the Terms and Privacy Policy to create an account.'); return; }
      try {
        const res = await fetch(API + '/api/auth/register', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password }),
        });
        const data = await res.json();
        if (!res.ok) { showError(data.error); return; }
        localStorage.setItem('quaver_user', JSON.stringify({ username: data.username, email: data.email }));
        showSuccess('Account created! Redirecting...');
        setTimeout(function() { window.location.href = 'Index.html'; }, 1000);
      } catch (err) {
        showError('Could not connect to server.');
      }
    }
  </script>
</body>
</html>
