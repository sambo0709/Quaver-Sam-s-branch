<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" href="nightmode_logo.png">
<title>Quaver</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="Index.html">
      <img class="logo" id="logo" src="quaver_nightmode1.png" alt="Quaver Logo">
    </a>
  </div>
  <div class="nav-center">
    <a class="nav-link active" href="Index.html">Home</a>
    <button class="nav-link" onclick="togglePlaylistPanel()">Playlist <span id="playlist-count" class="count-badge">0</span></button>
    <a class="nav-link" href="profile.html">Profile</a>
    <div id="spotify-login-btn" style="display:none">
      <a href="/spotify/login" class="nav-link spotify-nav-link">🎵 Spotify</a>
    </div>
    <div id="spotify-user-info" style="display:none">
      <span class="nav-link spotify-connected-link" id="spotify-user-name"></span>
    </div>
  </div>
  <div class="nav-right">
    <span id="nav-username" class="nav-username"></span>
    <button id="nav-logout" class="logout-btn" onclick="logout()" style="display:none">Logout</button>
    <a id="nav-login-link" href="login.html" class="login-nav-btn" style="display:none">Login</a>
    <button class="toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</nav>

<div id="toast" class="toast"></div>

<main>
  <h1>How are <span>you feeling?</span></h1>
  <p class="subtitle">Pick your mood and we'll choose a playlist for you.</p>
  <div class="dropdown-row">
    <select class="mood-select" id="mood-select" onchange="onMoodSelect(this.value)">
      <option disabled selected value="">Select Mood</option>
      <option value="happy">Happy</option>
      <option value="sad">Sad</option>
      <option value="energetic">Energetic</option>
      <option value="calm">Chill</option>
      <option value="focused">Focused</option>
      <option value="angry">Angry</option>
      <option value="romantic">Romantic</option>
    </select>
    <select class="mood-select" id="count-select" onchange="onCountSelect(this.value)">
      <option disabled selected value="">How many songs?</option>
      <option value="5">5 songs</option>
      <option value="8">8 songs</option>
      <option value="10">10 songs</option>
    </select>
  </div>
  <button class="mood-select random-btn" onclick="randomMood()">Random Mood</button>
  <div id="loading" class="loading" style="display:none">
    <div class="loading-bar"></div>
    <span>finding your sound...</span>
  </div>
  <div id="results" class="results"></div>
</main>

<section class="sotd-section" id="sotd">
  <div class="sotd-header">
    <div class="sotd-label">TODAY'S PICKS</div>
    <h2 class="sotd-title">Songs of the Day</h2>
    <p class="sotd-subtitle">Curated daily across every mood</p>
  </div>
  <div class="sotd-grid" id="sotd-grid">
    <div class="sotd-loading">
      <div class="loading-bar"></div>
      <span>loading today's picks...</span>
    </div>
  </div>
</section>

<div id="spotify-player" class="spotify-player" style="display:none">
  <div class="player-header">
    <span id="player-song-name">—</span>
    <button class="player-close-btn" onclick="closePlayer()">✕</button>
  </div>
  <iframe id="spotify-iframe"
    style="border-radius:12px"
    src=""
    width="100%"
    height="80"
    frameborder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>
</div>

<div class="playlist-overlay" id="playlist-overlay" onclick="togglePlaylistPanel()"></div>

<div class="playlist-panel" id="playlist-panel">
  <div class="panel-header">
    <h2 class="panel-title">My Playlist</h2>
    <button class="panel-close" onclick="togglePlaylistPanel()">✕</button>
  </div>
  <div class="save-form">
    <input type="text" id="playlist-name" class="playlist-input" placeholder="Playlist name..." />
    <button class="save-btn" onclick="savePlaylist()">Save</button>
  </div>
  <div id="panel-songs" class="panel-songs">
    <p class="empty-msg">Add songs from your results.</p>
  </div>
  <div id="saved-playlists" class="saved-playlists"></div>
</div>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  const moods = ['happy', 'sad', 'energetic', 'calm', 'focused', 'angry', 'romantic'];
  let currentMood = null;
  let currentLimit = 5;
  let playlistSongs = [];
  let savedPlaylists = [];
  let recentMoods = JSON.parse(localStorage.getItem('quaver_moods') || '[]');
  let activePlaylistName = null;
  let spotifyToken = localStorage.getItem('quaver_spotify_token') || null;

  function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + (type || 'success') + ' show';
    setTimeout(function() { toast.className = 'toast'; }, 3000);
  }

  function requireLogin(msg) {
    const token = localStorage.getItem('quaver_token');
    if (!token) {
      showToast(msg || 'You need an account to do that!', 'error');
      setTimeout(function() { window.location.href = 'login.html'; }, 1200);
      return false;
    }
    return true;
  }

  function logout() {
    localStorage.removeItem('quaver_token');
    localStorage.removeItem('quaver_user');
    localStorage.removeItem('quaver_spotify_token');
    localStorage.removeItem('quaver_spotify_name');
    localStorage.removeItem('quaver_playlists');
    window.location.href = 'login.html';
  }

  function updateAuthUI() {
    const user = JSON.parse(localStorage.getItem('quaver_user') || 'null');
    const logoutBtn = document.getElementById('nav-logout');
    const loginLink = document.getElementById('nav-login-link');
    const usernameEl = document.getElementById('nav-username');
    if (user) {
      usernameEl.textContent = 'Hi, ' + user.username + '!';
      logoutBtn.style.display = 'inline-block';
      loginLink.style.display = 'none';
    } else {
      usernameEl.textContent = '';
      logoutBtn.style.display = 'none';
      loginLink.style.display = 'inline-block';
    }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('theme-btn').textContent = theme === 'dark' ? '🌙' : '☀️';
    document.getElementById('logo').src = theme === 'dark' ? 'quaver_nightmode1.png' : 'quaver_lightmode1.png';
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('theme', next);
  }

  function checkSpotifyCallback() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('spotify_token');
    const name = params.get('spotify_name');
    const error = params.get('error');
    if (token) {
      localStorage.setItem('quaver_spotify_token', token);
      localStorage.setItem('quaver_spotify_name', name || 'Spotify User');
      spotifyToken = token;
      window.history.replaceState({}, '', window.location.pathname);
      showToast('Connected to Spotify as ' + (name || 'Spotify User') + '!', 'success');
    }
    if (error) {
      showToast('Spotify connection failed. Try again.', 'error');
      window.history.replaceState({}, '', window.location.pathname);
    }
  }

  function updateSpotifyUI() {
    const name = localStorage.getItem('quaver_spotify_name');
    if (spotifyToken && name) {
      document.getElementById('spotify-login-btn').style.display = 'none';
      document.getElementById('spotify-user-info').style.display = 'flex';
      document.getElementById('spotify-user-name').textContent = '✓ ' + name;
    } else {
      document.getElementById('spotify-login-btn').style.display = 'flex';
      document.getElementById('spotify-user-info').style.display = 'none';
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    applyTheme(localStorage.getItem('theme') || 'dark');
    checkSpotifyCallback();
    updateSpotifyUI();
    updateAuthUI();
    loadPlaylists();
    loadSongsOfTheDay();
  });

  async function loadPlaylists() {
    const token = localStorage.getItem('quaver_token');
    if (token) {
      try {
        const res = await fetch(API + '/api/playlist', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();
        if (data.playlists) {
          savedPlaylists = data.playlists;
          localStorage.setItem('quaver_playlists', JSON.stringify(savedPlaylists));
        }
      } catch (e) {}
    }
    renderSavedPlaylists();
  }

  function randomMood() {
    const random = moods[Math.floor(Math.random() * moods.length)];
    document.getElementById('mood-select').value = random;
    setMood(random);
  }

  function onMoodSelect(value) {
    if (!value) return;
    setMood(value);
  }

  function onCountSelect(value) {
    currentLimit = parseInt(value);
    if (currentMood) fetchSongs();
  }

  function setMood(mood) {
    currentMood = mood;
    recentMoods.unshift({ mood: mood, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
    if (recentMoods.length > 10) recentMoods.pop();
    localStorage.setItem('quaver_moods', JSON.stringify(recentMoods));
    const token = localStorage.getItem('quaver_token');
    if (token) {
      fetch(API + '/api/mood/history', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ mood: mood })
      }).catch(function() {});
    }
    fetchSongs();
  }

  async function fetchSongs() {
    document.getElementById('loading').style.display = 'flex';
    document.getElementById('results').innerHTML = '';
    try {
      const res = await fetch(API + '/api/music/recommend?mood=' + currentMood + '&limit=' + currentLimit);
      const data = await res.json();
      document.getElementById('loading').style.display = 'none';
      if (data.songs && data.songs.length > 0) {
        let html = '<div class="results-header">' + data.songs.length + ' tracks — ' + currentMood + '</div>';
        data.songs.forEach(function(song, i) {
          const inPlaylist = playlistSongs.some(function(s) { return s.title === song.title; });
          const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
          html += '<div class="song-card" style="animation-delay:' + (i * 0.06) + 's">';
          html += '<span class="song-num">' + String(i + 1).padStart(2, '0') + '</span>';
          html += song.album_art ? '<img class="album-art" src="' + song.album_art + '" alt="art"/>' : '<div class="album-art"></div>';
          html += '<div class="song-info"><div class="song-title">' + song.title + '</div><div class="song-artist">' + song.artist + '</div></div>';
          html += '<div class="song-actions">';
          if (trackId) html += '<button class="play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>';
          html += '<span class="song-duration">' + song.duration + '</span>';
          html += '<button class="add-btn' + (inPlaylist ? ' added' : '') + '" onclick=\'addToPlaylist(' + JSON.stringify(song).replace(/'/g, "&#39;") + ', this)\'>' + (inPlaylist ? 'Added' : '+ Add') + '</button>';
          html += '</div></div>';
        });
        document.getElementById('results').innerHTML = html;
      } else {
        document.getElementById('results').innerHTML = '<p class="no-results">No songs found. Try another mood!</p>';
      }
    } catch (err) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('results').innerHTML = '<p class="no-results">Could not connect to server.</p>';
    }
  }

  function playInApp(trackId, title) {
    document.getElementById('spotify-iframe').src = 'https://open.spotify.com/embed/track/' + trackId + '?utm_source=generator&theme=0';
    document.getElementById('player-song-name').textContent = title;
    document.getElementById('spotify-player').style.display = 'block';
    document.getElementById('spotify-player').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function closePlayer() {
    document.getElementById('spotify-iframe').src = '';
    document.getElementById('spotify-player').style.display = 'none';
  }

  function addToPlaylist(song, btn) {
    if (!requireLogin('You need an account to save songs!')) return;
    if (playlistSongs.some(function(s) { return s.title === song.title; })) return;
    playlistSongs.push(song);
    btn.textContent = 'Added';
    btn.classList.add('added');
    updatePlaylistBadge();
    renderPanelSongs();
    showToast(song.title + ' added to playlist!', 'success');
  }

  function removeFromPlaylist(index) {
    const removed = playlistSongs[index];
    playlistSongs.splice(index, 1);
    updatePlaylistBadge();
    renderPanelSongs();
    document.querySelectorAll('.add-btn').forEach(function(btn) {
      const titleEl = btn.closest('.song-card') && btn.closest('.song-card').querySelector('.song-title');
      if (titleEl && titleEl.textContent === removed.title) {
        btn.textContent = '+ Add';
        btn.classList.remove('added');
      }
    });
  }

  function updatePlaylistBadge() {
    document.getElementById('playlist-count').textContent = playlistSongs.length;
  }

  function renderPanelSongs() {
    const container = document.getElementById('panel-songs');
    let header = '';
    if (activePlaylistName) {
      header = '<div class="active-playlist-header"><button class="back-btn" onclick="clearActivePlaylist()">← Back</button><span class="active-playlist-name">' + activePlaylistName + '</span></div>';
    }
    if (playlistSongs.length === 0) {
      container.innerHTML = header + '<p class="empty-msg">Add songs from your results.</p>';
      return;
    }
    container.innerHTML = header + playlistSongs.map(function(song, i) {
      const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
      return '<div class="panel-song-item"><div class="panel-song-info"><div class="panel-song-title">' + song.title + '</div><div class="panel-song-artist">' + song.artist + '</div></div><div class="panel-song-actions">' +
        (trackId ? '<button class="panel-play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>' : '') +
        '<button class="remove-btn" onclick="removeFromPlaylist(' + i + ')">✕</button></div></div>';
    }).join('');
  }

  function openSavedPlaylist(index) {
    const pl = savedPlaylists[index];
    activePlaylistName = pl.name;
    playlistSongs = pl.songs.slice();
    updatePlaylistBadge();
    renderPanelSongs();
  }

  function clearActivePlaylist() {
    activePlaylistName = null;
    playlistSongs = [];
    updatePlaylistBadge();
    renderPanelSongs();
  }

  function togglePlaylistPanel() {
    if (!requireLogin('You need an account to use playlists!')) return;
    document.getElementById('playlist-panel').classList.toggle('open');
    document.getElementById('playlist-overlay').classList.toggle('open');
  }

  async function savePlaylist() {
    if (!requireLogin('You need an account to save playlists!')) return;
    const name = document.getElementById('playlist-name').value.trim();
    if (!name) { document.getElementById('playlist-name').focus(); return; }
    if (playlistSongs.length === 0) { showToast('Add some songs first!', 'error'); return; }
    try {
      const token = localStorage.getItem('quaver_token');
      const res = await fetch(API + '/api/playlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: name, mood: currentMood || 'mixed', songs: playlistSongs }),
      });
      const data = await res.json();
      savedPlaylists.push(data.playlist);
      localStorage.setItem('quaver_playlists', JSON.stringify(savedPlaylists));
      document.getElementById('playlist-name').value = '';
      activePlaylistName = null;
      playlistSongs = [];
      updatePlaylistBadge();
      renderPanelSongs();
      renderSavedPlaylists();
      showToast('Playlist "' + name + '" saved!', 'success');
    } catch (err) {
      showToast('Could not save. Is the server running?', 'error');
    }
  }

  async function renamePlaylist(index) {
    const pl = savedPlaylists[index];
    const newName = window.prompt('Rename playlist:', pl.name);
    if (!newName || !newName.trim() || newName.trim() === pl.name) return;
    const token = localStorage.getItem('quaver_token');
    try {
      await fetch(API + '/api/playlist/' + pl.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ name: newName.trim() }),
      });
      savedPlaylists[index].name = newName.trim();
      localStorage.setItem('quaver_playlists', JSON.stringify(savedPlaylists));
      renderSavedPlaylists();
      showToast('Playlist renamed!', 'success');
    } catch (err) {
      showToast('Could not rename playlist.', 'error');
    }
  }

  async function sharePlaylist(index) {
    const pl = savedPlaylists[index];
    const token = localStorage.getItem('quaver_token');
    try {
      await fetch(API + '/api/playlist/' + pl.id + '/share', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ isPublic: true }),
      });
      savedPlaylists[index].isPublic = true;
      localStorage.setItem('quaver_playlists', JSON.stringify(savedPlaylists));
      const shareUrl = window.location.origin + '/share.html?id=' + pl.id;
      navigator.clipboard.writeText(shareUrl).then(function() {
        showToast('Share link copied!', 'success');
      }).catch(function() {
        window.prompt('Copy this link:', shareUrl);
      });
    } catch (err) {
      showToast('Could not create share link.', 'error');
    }
  }

  async function exportToSpotify(index) {
    if (!spotifyToken) { showToast('Connect your Spotify account first!', 'error'); return; }
    const pl = savedPlaylists[index];
    const trackUris = pl.songs
      .filter(function(s) { return s.spotify_url; })
      .map(function(s) { return 'spotify:track:' + s.spotify_url.split('/track/')[1]; });
    if (trackUris.length === 0) { showToast('No Spotify tracks found in this playlist.', 'error'); return; }
    showToast('Exporting to Spotify...', 'success');
    try {
      const res = await fetch(API + '/spotify/export', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ playlistName: pl.name + ' (from Quaver)', trackUris, spotifyToken }),
      });
      const data = await res.json();
      if (res.ok) {
        showToast('Exported to Spotify! Opening...', 'success');
        setTimeout(function() { window.open(data.playlist_url, '_blank'); }, 500);
      } else {
        if (res.status === 401 || (data.error && data.error.includes('login'))) {
          localStorage.removeItem('quaver_spotify_token');
          localStorage.removeItem('quaver_spotify_name');
          spotifyToken = null;
          updateSpotifyUI();
          showToast('Spotify session expired — please reconnect Spotify.', 'error');
        } else {
          showToast(data.error || 'Export failed.', 'error');
        }
      }
    } catch (err) {
      showToast('Could not connect to server.', 'error');
    }
  }

  function renderSavedPlaylists() {
    const container = document.getElementById('saved-playlists');
    if (savedPlaylists.length === 0) { container.innerHTML = ''; return; }
    let html = '<div class="saved-section-label">Saved playlists</div>';
    savedPlaylists.forEach(function(pl, i) {
      html += '<div class="saved-playlist-item">';
      html += '<div class="saved-playlist-info" onclick="openSavedPlaylist(' + i + ')">';
      html += '<div class="saved-playlist-name">' + pl.name + '</div>';
      html += '<div class="saved-playlist-meta">' + pl.songs.length + ' songs · ' + pl.mood + '</div>';
      html += '</div>';
      html += '<div style="display:flex;gap:6px;align-items:center;">';
      html += '<button class="export-spotify-btn" onclick="exportToSpotify(' + i + ')">▶ Spotify</button>';
      html += '<button class="rename-playlist-btn" onclick="renamePlaylist(' + i + ')" title="Rename">✏️</button>';
      html += '<button class="share-playlist-btn" onclick="sharePlaylist(' + i + ')" title="' + (pl.isPublic ? 'Copy share link' : 'Share') + '">' + (pl.isPublic ? '🔗' : '↗') + '</button>';
      html += '<button class="delete-playlist-btn" onclick="deletePlaylist(' + i + ')">✕</button>';
      html += '</div></div>';
    });
    container.innerHTML = html;
  }

  function renderSotd(picks, grid) {
    let html = '';
    for (let i = 0; i < picks.length; i++) {
      const song = picks[i];
      const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
      const safeTitle = song.title.replace(/'/g, "\\'");
      const songJson = JSON.stringify(song).replace(/'/g, "&#39;");
      html += '<div class="sotd-card">';
      html += '<span class="sotd-num">' + String(i + 1).padStart(2, '0') + '</span>';
      html += song.album_art ? '<img class="sotd-art" src="' + song.album_art + '" alt="art"/>' : '<div class="sotd-art"></div>';
      html += '<div class="sotd-info">';
      html += '<div class="sotd-song-title">' + song.title + '</div>';
      html += '<div class="sotd-song-artist">' + song.artist + '</div>';
      html += '</div>';
      html += '<div class="sotd-mood-tag">' + song.mood + '</div>';
      html += '<div class="sotd-actions">';
      if (trackId) {
        html += '<button class="sotd-play-btn" onclick="playInApp(\'' + trackId + '\', \'' + safeTitle + '\')">&#9654;</button>';
      }
      html += '<button class="sotd-add-btn" onclick=\'addToPlaylist(' + songJson + ', this)\'>+ Add</button>';
      html += '</div>';
      html += '</div>';
    }
    grid.innerHTML = html;
  }

  async function loadSongsOfTheDay() {
    const grid = document.getElementById('sotd-grid');
    const CACHE_KEY = 'quaver_sotd';
    const CACHE_TTL = 60 * 60 * 1000; // 1 hour

    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && Date.now() - cached.ts < CACHE_TTL && cached.picks.length > 0) {
        renderSotd(cached.picks, grid);
        return;
      }
    } catch(e) {}

    try {
      const res = await fetch(API + '/api/music/sotd');
      const data = await res.json();
      const picks = data.picks || [];
      if (picks.length === 0) {
        grid.innerHTML = '<p class="no-results">Could not load picks.</p>';
        return;
      }
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), picks })); } catch(e) {}
      renderSotd(picks, grid);
    } catch(e) {
      grid.innerHTML = '<p class="no-results">Could not load picks. Is the server running?</p>';
    }
  }

  async function deletePlaylist(index) {
    const pl = savedPlaylists[index];
    const token = localStorage.getItem('quaver_token');
    try {
      await fetch(API + '/api/playlist/' + pl.id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
    } catch(e) {}
    savedPlaylists.splice(index, 1);
    localStorage.setItem('quaver_playlists', JSON.stringify(savedPlaylists));
    renderSavedPlaylists();
    showToast('Playlist deleted.', 'success');
  }
</script>
</body>
</html>
