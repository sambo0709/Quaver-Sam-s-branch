<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quaver</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="HomePage.css">
</head>
<body>

  <nav>
    <img class="logo" id="logo" src="Quavernightmode1.PNG" alt="Quaver">
    <div class="nav-right">
      <button class="playlist-toggle" onclick="togglePlaylistPanel()">
        My Playlist <span id="playlist-count" class="count-badge">0</span>
      </button>
      <button class="toggle" onclick="toggleTheme()">☀ Light</button>
      <div class="profile">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
    </div>
  </nav>

  <main>
    <h1>How are <span>you feeling?</span></h1>
    <p class="subtitle">Pick your mood and we'll choose a playlist for you.</p>

    <div class="dropdown-row">
      <select class="mood-select" id="mood-select" onchange="onMoodSelect(this.value)">
        <option disabled selected value="">Select Mood</option>
        <option value="happy">Happy</option>
        <option value="sad">Sad</option>
        <option value="energetic">Energetic</option>
        <option value="calm">Chill</option>
        <option value="focused">Focused</option>
        <option value="angry">Angry</option>
        <option value="romantic">Romantic</option>
      </select>

      <select class="mood-select" id="count-select" onchange="onCountSelect(this.value)">
        <option disabled selected value="">How many songs?</option>
        <option value="5">5 songs</option>
        <option value="8">8 songs</option>
        <option value="10">10 songs</option>
      </select>
    </div>

    <button class="mood-select random-btn" onclick="randomMood()">Random Mood</button>

    <div id="loading" class="loading" style="display:none">
      <div class="loading-bar"></div>
      <span>finding your sound...</span>
    </div>

    <div id="results" class="results"></div>
  </main>

  <!-- Spotify Embed Player -->
  <div id="spotify-player" class="spotify-player" style="display:none">
    <div class="player-header">
      <span id="player-song-name">—</span>
      <button class="player-close-btn" onclick="closePlayer()">✕</button>
    </div>
    <iframe id="spotify-iframe"
      style="border-radius:12px"
      src=""
      width="100%"
      height="80"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

  <!-- Playlist Overlay -->
  <div class="playlist-overlay" id="playlist-overlay" onclick="togglePlaylistPanel()"></div>

  <!-- Playlist Panel -->
  <div class="playlist-panel" id="playlist-panel">
    <div class="panel-header">
      <h2 class="panel-title">My Playlist</h2>
      <button class="panel-close" onclick="togglePlaylistPanel()">✕</button>
    </div>
    <div class="save-form">
      <input type="text" id="playlist-name" class="playlist-input" placeholder="Playlist name..." />
      <button class="save-btn" onclick="savePlaylist()">Save</button>
    </div>
    <div id="panel-songs" class="panel-songs">
      <p class="empty-msg">Add songs from your results.</p>
    </div>
    <div id="saved-playlists" class="saved-playlists"></div>
  </div>

  <script>
    const moods = ['happy', 'sad', 'energetic', 'calm', 'focused', 'angry', 'romantic'];
    let currentMood = null;
    let currentLimit = 5;
    let playlistSongs = [];
    let savedPlaylists = [];
    let activePlaylistName = null;

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.querySelector('.toggle');
      const logo = document.getElementById('logo');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '☾ Dark';
        logo.src = 'Quaverlightmode1.PNG';
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '☀ Light';
        logo.src = 'Quavernightmode1.PNG';
      }
    }

    function randomMood() {
      const random = moods[Math.floor(Math.random() * moods.length)];
      document.getElementById('mood-select').value = random;
      setMood(random);
    }

    function onMoodSelect(value) {
      if (!value) return;
      setMood(value);
    }

    function onCountSelect(value) {
      currentLimit = parseInt(value);
      if (currentMood) fetchSongs();
    }

    function setMood(mood) {
      currentMood = mood;
      fetchSongs();
    }

    async function fetchSongs() {
      document.getElementById('loading').style.display = 'flex';
      document.getElementById('results').innerHTML = '';

      try {
        const res = await fetch('http://localhost:3000/api/music/recommend?mood=' + currentMood + '&limit=' + currentLimit);
        const data = await res.json();
        document.getElementById('loading').style.display = 'none';

        if (data.songs && data.songs.length > 0) {
          let html = '<div class="results-header">' + data.songs.length + ' tracks — ' + currentMood + '</div>';

          data.songs.forEach(function(song, i) {
            const inPlaylist = playlistSongs.some(function(s) { return s.title === song.title; });
            const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;

            html += '<div class="song-card" style="animation-delay:' + (i * 0.06) + 's">';
            html += '<span class="song-num">' + String(i + 1).padStart(2, '0') + '</span>';
            if (song.album_art) {
              html += '<img class="album-art" src="' + song.album_art + '" alt="art"/>';
            } else {
              html += '<div class="album-art"></div>';
            }
            html += '<div class="song-info">';
            html += '<div class="song-title">' + song.title + '</div>';
            html += '<div class="song-artist">' + song.artist + '</div>';
            html += '</div>';
            html += '<div class="song-actions">';
            if (trackId) {
              html += '<button class="play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>';
            }
            html += '<span class="song-duration">' + song.duration + '</span>';
            html += '<button class="add-btn' + (inPlaylist ? ' added' : '') + '" onclick=\'addToPlaylist(' + JSON.stringify(song).replace(/'/g, "&#39;") + ', this)\'>' + (inPlaylist ? 'Added' : '+ Add') + '</button>';
            html += '</div></div>';
          });

          document.getElementById('results').innerHTML = html;
        } else {
          document.getElementById('results').innerHTML = '<p class="no-results">No songs found. Try another mood!</p>';
        }
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('results').innerHTML = '<p class="no-results">Could not connect to server. Make sure it\'s running on port 3000.</p>';
      }
    }

    function playInApp(trackId, title) {
      const player = document.getElementById('spotify-player');
      const iframe = document.getElementById('spotify-iframe');
      const songName = document.getElementById('player-song-name');
      iframe.src = 'https://open.spotify.com/embed/track/' + trackId + '?utm_source=generator&theme=0';
      songName.textContent = title;
      player.style.display = 'block';
      player.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closePlayer() {
      document.getElementById('spotify-iframe').src = '';
      document.getElementById('spotify-player').style.display = 'none';
    }

    function addToPlaylist(song, btn) {
      if (playlistSongs.some(function(s) { return s.title === song.title; })) return;
      playlistSongs.push(song);
      btn.textContent = 'Added';
      btn.classList.add('added');
      updatePlaylistBadge();
      renderPanelSongs();
    }

    function removeFromPlaylist(index) {
      const removed = playlistSongs[index];
      playlistSongs.splice(index, 1);
      updatePlaylistBadge();
      renderPanelSongs();
      document.querySelectorAll('.add-btn').forEach(function(btn) {
        const titleEl = btn.closest('.song-card') && btn.closest('.song-card').querySelector('.song-title');
        if (titleEl && titleEl.textContent === removed.title) {
          btn.textContent = '+ Add';
          btn.classList.remove('added');
        }
      });
    }

    function updatePlaylistBadge() {
      document.getElementById('playlist-count').textContent = playlistSongs.length;
    }

    function renderPanelSongs() {
      const container = document.getElementById('panel-songs');

      let header = '';
      if (activePlaylistName) {
        header = '<div class="active-playlist-header">' +
          '<button class="back-btn" onclick="clearActivePlaylist()">← Back</button>' +
          '<span class="active-playlist-name">' + activePlaylistName + '</span>' +
        '</div>';
      }

      if (playlistSongs.length === 0) {
        container.innerHTML = header + '<p class="empty-msg">Add songs from your results.</p>';
        return;
      }

      container.innerHTML = header + playlistSongs.map(function(song, i) {
        const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
        return '<div class="panel-song-item">' +
          '<div class="panel-song-info">' +
            '<div class="panel-song-title">' + song.title + '</div>' +
            '<div class="panel-song-artist">' + song.artist + '</div>' +
          '</div>' +
          '<div class="panel-song-actions">' +
            (trackId ? '<button class="panel-play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>' : '') +
            '<button class="remove-btn" onclick="removeFromPlaylist(' + i + ')">✕</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function openSavedPlaylist(index) {
      const pl = savedPlaylists[index];
      activePlaylistName = pl.name;
      playlistSongs = pl.songs.slice();
      updatePlaylistBadge();
      renderPanelSongs();
    }

    function clearActivePlaylist() {
      activePlaylistName = null;
      playlistSongs = [];
      updatePlaylistBadge();
      renderPanelSongs();
    }

    async function savePlaylist() {
      const name = document.getElementById('playlist-name').value.trim();
      if (!name) { document.getElementById('playlist-name').focus(); return; }
      if (playlistSongs.length === 0) { alert('Add some songs first!'); return; }
      try {
        const res = await fetch('http://localhost:3000/api/playlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, mood: currentMood || 'mixed', songs: playlistSongs }),
        });
        const data = await res.json();
        savedPlaylists.push(data.playlist);
        document.getElementById('playlist-name').value = '';
        activePlaylistName = null;
        playlistSongs = [];
        updatePlaylistBadge();
        renderPanelSongs();
        renderSavedPlaylists();
      } catch (err) {
        alert('Could not save. Is the server running?');
      }
    }

    function renderSavedPlaylists() {
      const container = document.getElementById('saved-playlists');
      if (savedPlaylists.length === 0) { container.innerHTML = ''; return; }
      let html = '<div class="saved-section-label">Saved playlists</div>';
      savedPlaylists.forEach(function(pl, i) {
        html += '<div class="saved-playlist-item">';
        html += '<div class="saved-playlist-info" onclick="openSavedPlaylist(' + i + ')">';
        html += '<div class="saved-playlist-name">' + pl.name + '</div>';
        html += '<div class="saved-playlist-meta">' + pl.songs.length + ' songs · ' + pl.mood + '</div>';
        html += '</div>';
        html += '<button class="delete-playlist-btn" onclick="deletePlaylist(' + i + ')">✕</button>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    async function deletePlaylist(index) {
      const pl = savedPlaylists[index];
      try { await fetch('http://localhost:3000/api/playlist/' + pl.id, { method: 'DELETE' }); } catch(e) {}
      savedPlaylists.splice(index, 1);
      renderSavedPlaylists();
    }

    function togglePlaylistPanel() {
      document.getElementById('playlist-panel').classList.toggle('open');
      document.getElementById('playlist-overlay').classList.toggle('open');
    }
  </script>
</body>
</html>
