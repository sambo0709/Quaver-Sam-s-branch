<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#00d4ff"/>
  <title>Search - Quaver</title>
  <link rel="icon" href="quaver-q-dark.png"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body class="profile-page search-page">
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <nav class="top-nav">
    <div class="nav-left"><img class="logo brand-mark" id="logo" src="quaver-q-dark.png" alt="Quaver"/></div>
    <div class="nav-center"><a class="nav-link home-nav-link" href="Index.html" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6v9H5v-9Z"/><path d="M9 19v-6h6v6"/></svg><span>Home</span></a><form class="global-search" action="search.html" method="get" role="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><input name="q" type="search" placeholder="What do you want to play?" aria-label="Search songs, artists, or albums"/></form><a class="nav-link" href="playlists.html">Playlists</a></div>
    <div class="nav-right"></div>
  </nav>

  <main class="search-main">
    <header class="search-header"><span>DISCOVER</span><h1>Search</h1><p>Find a song, artist, or album.</p></header>
    <form id="search-page-form" class="search-page-form" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      <input id="search-page-input" type="search" placeholder="Song, artist, or album" autocomplete="off" aria-label="Search songs, artists, or albums" required/>
      <button type="submit">Search</button>
    </form>
    <div id="search-page-status" class="search-page-status" aria-live="polite">Start with a song, artist, or album.</div>
    <section id="search-page-results" class="search-page-results" aria-label="Search results"></section>
  </main>

  <div id="spotify-player" class="spotify-player" style="display:none" role="region" aria-label="Now playing">
    <div class="player-identity" aria-live="polite"><div class="player-artwork"><img id="player-art" alt="" hidden/><span id="player-art-placeholder" aria-hidden="true">Q</span></div><div class="player-track-copy"><span class="now-playing-label">NOW PLAYING</span><strong id="player-song-name">Choose a song</strong><small id="player-song-artist">Quaver</small></div><a id="player-spotify-link" class="player-spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener" aria-label="Open current track in Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 9.1c3.7-1 7.7-.7 10.9.9M7.8 12.4c3-.8 6.5-.5 9.2.7M8.5 15.4c2.4-.6 5.1-.4 7.3.6"/></svg><span>Spotify</span></a></div>
    <div class="player-center"><div class="player-transport"><button class="player-control-button" onclick="playerPrevious()" title="Previous" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6.5 9 12l10 5.5Z"/></svg></button><button id="player-toggle" class="player-toggle-button" onclick="QuaverPlayer.toggle()" title="Play" aria-label="Play"><svg class="player-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 9 5-9 5Z"/></svg><svg class="player-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h3v10H8zM13 7h3v10h-3z"/></svg></button><button class="player-control-button" onclick="playerNext()" title="Next" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6.5 15 12 5 17.5Z"/></svg></button></div><div class="player-progress-row"><span id="player-current-time">0:00</span><input id="player-progress" class="player-range" type="range" min="0" max="1" value="0" aria-label="Song progress" oninput="QuaverPlayer.previewSeek(this.value)" onchange="QuaverPlayer.seek(this.value)"/><span id="player-duration">0:00</span></div><div class="player-status-line"><span id="player-status" data-state="">Ready when you are</span><a id="player-status-action" href="settings.html#spotify-settings" hidden></a></div></div>
    <div class="player-actions"><div class="player-volume-controls"><button id="player-volume-button" class="player-control-button" onclick="QuaverPlayer.toggleMute()" title="Mute" aria-label="Mute"><svg class="player-volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3ZM15 9c1 .8 1.5 1.8 1.5 3S16 14.2 15 15M17.5 7c1.7 1.3 2.5 3 2.5 5s-.8 3.7-2.5 5"/></svg><svg class="player-muted-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3ZM16 10l4 4M20 10l-4 4"/></svg></button><input id="player-volume" class="player-range player-volume-range" type="range" min="0" max="100" value="70" aria-label="Volume" oninput="QuaverPlayer.setVolume(this.value)"/></div><button class="player-close-btn" onclick="closePlayer()" aria-label="Close player" title="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div>
  </div>

  <div class="playlist-picker-overlay" id="playlist-picker-overlay"></div>
  <div class="playlist-picker" id="playlist-picker" role="dialog" aria-modal="true" aria-labelledby="playlist-picker-title" hidden>
    <div class="playlist-picker-heading"><strong id="playlist-picker-title">Add to playlist</strong><button id="playlist-picker-close" type="button" aria-label="Close">✕</button></div>
    <p id="playlist-picker-song"></p>
    <div id="playlist-picker-list" class="playlist-picker-list"></div>
    <button class="playlist-picker-create" id="playlist-picker-create" type="button">＋ Create new playlist</button>
  </div>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation"><a href="Index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 10 8-6 8 6v9H5v-9Z"/><path d="M9 19v-6h6v6"/></svg>Home</a><a class="active" href="search.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>Search</a><a href="playlists.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 11h11M9 16h7"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="11" r="1"/><circle cx="4.5" cy="16" r="1"/></svg>Playlists</a><a href="profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.6-4 3-6 7-6s6.4 2 7 6"/></svg>Account</a></nav>
  <script src="search.js"></script>
  <script src="spotify-player.js"></script>
</body>
</html>
