<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Quaver</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="top-nav">
    <!-- Left: Logo -->
    <div class="nav-left">
      <a href="Index.html">
        <img class="logo" id="logo" src="quaver_nightmode1.png" alt="Quaver Logo">
      </a>
    </div>

    <!-- Center: Floating nav pill -->
    <div class="nav-center">
      <a class="nav-link" href="Index.html">Home</a>
      <a class="nav-link active" href="profile.html">Profile</a>
    </div>

    <!-- Right: Actions + theme toggle -->
    <div class="nav-right">
      <span id="nav-username" class="nav-username"></span>
      <button id="nav-logout" class="logout-btn" onclick="logout()" style="display:none">Logout</button>
      <button class="toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </nav>

  <div id="spotify-player" class="spotify-player" style="display:none">
    <div class="player-header">
      <span id="player-song-name">—</span>
      <button class="player-close-btn" onclick="closePlayer()">✕</button>
    </div>
    <iframe id="spotify-iframe"
      style="border-radius:12px"
      src=""
      width="100%"
      height="80"
      frameborder="0"
      allowfullscreen=""
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>
  </div>

  <main class="profile-main">
    <h1 class="profile-title">Profile</h1>
    <div class="content-boxes">

      <div class="box">
        <h2>Mood Stats</h2>
        <div id="mood-analytics">
          <p class="box-empty">No moods yet. Pick one on the home page!</p>
        </div>
        <h2 style="margin-top:1.5rem;">Recent Moods</h2>
        <div id="recent-moods-list">
          <p class="box-empty">No moods yet. Pick one on the home page!</p>
        </div>
      </div>

      <div class="box">
        <h2>Playlists</h2>
        <div id="playlists-list">
          <p class="box-empty">No playlists saved yet.</p>
        </div>
      </div>

      <div class="box">
        <h2>Suggestions</h2>
        <div id="suggestions-list">
          <p class="box-empty">Pick a mood to get suggestions.</p>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

    function toggleTheme() {
      const html = document.documentElement;
      const btn = document.querySelector('.toggle');
      const logo = document.getElementById('logo');
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        btn.textContent = '☀️';
        logo.src = 'quaver_lightmode1.png';
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        btn.textContent = '🌙';
        logo.src = 'quaver_nightmode1.png';
        localStorage.setItem('theme', 'dark');
      }
    }

    function logout() {
      localStorage.removeItem('quaver_token');
      localStorage.removeItem('quaver_user');
      localStorage.removeItem('quaver_playlists');
      localStorage.removeItem('quaver_spotify_token');
      localStorage.removeItem('quaver_spotify_name');
      window.location.href = 'login.html';
    }

    function updateAuthUI() {
      const user = JSON.parse(localStorage.getItem('quaver_user') || 'null');
      const logoutBtn = document.getElementById('nav-logout');
      const usernameEl = document.getElementById('nav-username');
      if (user) {
        usernameEl.textContent = 'Hi, ' + user.username + '!';
        logoutBtn.style.display = 'inline-block';
      }
    }

    function playInApp(trackId, title) {
      document.getElementById('spotify-iframe').src = 'https://open.spotify.com/embed/track/' + trackId + '?utm_source=generator&theme=0';
      document.getElementById('player-song-name').textContent = title;
      document.getElementById('spotify-player').style.display = 'block';
    }

    function closePlayer() {
      document.getElementById('spotify-iframe').src = '';
      document.getElementById('spotify-player').style.display = 'none';
    }

    const moodEmoji = { happy: '😊', sad: '😢', energetic: '⚡', calm: '😌', focused: '🎯', angry: '😤', romantic: '❤️' };

    function renderMoodAnalytics(moods) {
      const container = document.getElementById('mood-analytics');
      if (!moods || moods.length === 0) {
        container.innerHTML = '<p class="box-empty">No moods yet. Pick one on the home page!</p>';
        return;
      }
      const counts = {};
      moods.forEach(function(m) { counts[m.mood] = (counts[m.mood] || 0) + 1; });
      const total = moods.length;
      const sorted = Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; });
      let html = '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">' + total + ' total picks</div>';
      sorted.forEach(function(mood) {
        const pct = Math.round((counts[mood] / total) * 100);
        html += '<div style="margin-bottom:10px;">';
        html += '<div style="display:flex;justify-content:space-between;font-size:0.82rem;margin-bottom:4px;">';
        html += '<span>' + (moodEmoji[mood] || '') + ' ' + mood + '</span>';
        html += '<span style="color:var(--text-muted);">' + counts[mood] + 'x &nbsp;' + pct + '%</span>';
        html += '</div>';
        html += '<div style="height:6px;background:var(--glass-border);border-radius:3px;">';
        html += '<div style="height:6px;width:' + pct + '%;background:var(--gradient);border-radius:3px;transition:width 0.6s ease;"></div>';
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    function renderRecentMoods(moods) {
      const container = document.getElementById('recent-moods-list');
      if (!moods || moods.length === 0) {
        container.innerHTML = '<p class="box-empty">No moods yet. Pick one on the home page!</p>';
        return;
      }
      container.innerHTML = moods.map(function(item) {
        return '<div class="profile-mood-item"><span class="profile-mood-badge">' + item.mood + '</span><span class="profile-mood-time">' + item.time + '</span></div>';
      }).join('');
    }

    function renderPlaylists(playlists) {
      const container = document.getElementById('playlists-list');
      if (!playlists || playlists.length === 0) {
        container.innerHTML = '<p class="box-empty">No playlists saved yet.</p>';
        return;
      }
      container.innerHTML = playlists.map(function(pl, i) {
        return '<div class="profile-playlist-item" onclick="togglePlaylistSongs(' + i + ')">' +
          '<div><div class="profile-playlist-name">' + pl.name + '</div>' +
          '<div class="profile-playlist-meta">' + pl.songs.length + ' songs · ' + pl.mood + '</div></div>' +
          '<span style="color:var(--accent);font-size:12px;flex-shrink:0;">▼</span>' +
        '</div>' +
        '<div id="playlist-songs-' + i + '" style="display:none;padding:8px 0 4px;">' +
          pl.songs.map(function(song) {
            const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
            return '<div class="profile-suggestion-item">' +
              (song.album_art ? '<img class="profile-suggestion-art" src="' + song.album_art + '" alt="art"/>' : '<div class="profile-suggestion-art"></div>') +
              '<div class="profile-suggestion-info"><div class="profile-suggestion-title">' + song.title + '</div><div class="profile-suggestion-artist">' + song.artist + '</div></div>' +
              (trackId ? '<button class="profile-suggestion-play" onclick="event.stopPropagation();playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>' : '') +
            '</div>';
          }).join('') +
        '</div>';
      }).join('');
    }

    function togglePlaylistSongs(index) {
      const el = document.getElementById('playlist-songs-' + index);
      if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    async function renderSuggestions(moods) {
      const container = document.getElementById('suggestions-list');
      if (!moods || moods.length === 0) {
        container.innerHTML = '<p class="box-empty">Pick a mood to get suggestions.</p>';
        return;
      }
      const moodCounts = {};
      moods.forEach(function(m) { moodCounts[m.mood] = (moodCounts[m.mood] || 0) + 1; });
      const topMood = Object.keys(moodCounts).sort(function(a, b) { return moodCounts[b] - moodCounts[a]; })[0];
      container.innerHTML = '<p class="box-empty">Loading for <strong>' + topMood + '</strong>...</p>';
      try {
        const res = await fetch(API + '/api/music/recommend?mood=' + topMood + '&limit=5');
        const data = await res.json();
        if (data.songs && data.songs.length > 0) {
          container.innerHTML =
            '<div style="font-family:Quicksand,sans-serif;font-size:11px;color:var(--text);opacity:0.5;margin-bottom:12px;">Based on your love of <strong>' + topMood + '</strong></div>' +
            data.songs.map(function(song) {
              const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
              return '<div class="profile-suggestion-item">' +
                (song.album_art ? '<img class="profile-suggestion-art" src="' + song.album_art + '" alt="art"/>' : '<div class="profile-suggestion-art"></div>') +
                '<div class="profile-suggestion-info"><div class="profile-suggestion-title">' + song.title + '</div><div class="profile-suggestion-artist">' + song.artist + '</div></div>' +
                (trackId ? '<button class="profile-suggestion-play" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>' : '') +
              '</div>';
            }).join('');
        }
      } catch (err) {
        container.innerHTML = '<p class="box-empty">Could not load suggestions.</p>';
      }
    }

    async function loadProfileData() {
      const token = localStorage.getItem('quaver_token');
      let playlists = JSON.parse(localStorage.getItem('quaver_playlists') || '[]');
      if (token) {
        try {
          const res = await fetch(API + '/api/playlist', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (data.playlists) {
            playlists = data.playlists;
            localStorage.setItem('quaver_playlists', JSON.stringify(playlists));
          }
        } catch (e) {}
      }
      let moods = [];
      if (token) {
        try {
          const moodRes = await fetch(API + '/api/mood/history', {
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const moodData = await moodRes.json();
          if (moodData.moods) moods = [...moodData.moods].reverse();
        } catch (e) {}
      }
      renderMoodAnalytics(moods);
      renderRecentMoods(moods);
      renderPlaylists(playlists);
      renderSuggestions(moods);
    }

    window.addEventListener('DOMContentLoaded', function() {
      // Redirect to login if not logged in
      if (!localStorage.getItem('quaver_token')) {
        window.location.href = 'login.html';
        return;
      }
      const saved = localStorage.getItem('theme');
      const isDark = !saved || saved === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.querySelector('.toggle').textContent = isDark ? '🌙' : '☀️';
      document.getElementById('logo').src = isDark ? 'quaver_nightmode1.png' : 'quaver_lightmode1.png';
      updateAuthUI();
      loadProfileData();
    });
  </script>
</body>
</html>
