<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shared Playlist - Quaver</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="share-page">

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<nav class="top-nav">
  <div class="nav-left">
    <a href="Index.html">
      <img class="logo" id="logo" src="quaver_nightmode1.png" alt="Quaver Logo">
    </a>
  </div>
  <div class="nav-center">
    <a class="nav-link" href="Index.html">Home</a>
  </div>
  <div class="nav-right"></div>
</nav>

<div id="spotify-player" class="spotify-player" style="display:none" role="region" aria-label="Now playing">
  <div class="player-identity" aria-live="polite">
    <div class="player-artwork"><img id="player-art" alt="" hidden/><span id="player-art-placeholder" aria-hidden="true">Q</span></div>
    <div class="player-track-copy"><span class="now-playing-label">NOW PLAYING</span><strong id="player-song-name">Choose a song</strong><small id="player-song-artist">Quaver</small></div>
    <a id="player-spotify-link" class="player-spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener" aria-label="Open current track in Spotify"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7 9.1c3.7-1 7.7-.7 10.9.9M7.8 12.4c3-.8 6.5-.5 9.2.7M8.5 15.4c2.4-.6 5.1-.4 7.3.6"/></svg><span>Spotify</span></a>
  </div>
  <div class="player-center">
    <div class="player-transport">
      <button class="player-control-button" onclick="QuaverPlayer.previous()" title="Previous" aria-label="Previous song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6.5 9 12l10 5.5Z"/></svg></button>
      <button id="player-toggle" class="player-toggle-button" onclick="QuaverPlayer.toggle()" title="Play" aria-label="Play"><svg class="player-play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 7 9 5-9 5Z"/></svg><svg class="player-pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h3v10H8zM13 7h3v10h-3z"/></svg></button>
      <button class="player-control-button" onclick="QuaverPlayer.next()" title="Next" aria-label="Next song"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6.5 15 12 5 17.5Z"/></svg></button>
    </div>
    <div class="player-progress-row"><span id="player-current-time">0:00</span><input id="player-progress" class="player-range" type="range" min="0" max="1" value="0" aria-label="Song progress" oninput="QuaverPlayer.previewSeek(this.value)" onchange="QuaverPlayer.seek(this.value)"/><span id="player-duration">0:00</span></div>
    <div class="player-status-line"><span id="player-status" data-state="">Ready when you are</span><a id="player-status-action" href="settings.html#spotify-settings" hidden></a></div>
  </div>
  <div class="player-actions">
    <div class="player-volume-controls"><button id="player-volume-button" class="player-control-button" onclick="QuaverPlayer.toggleMute()" title="Mute" aria-label="Mute"><svg class="player-volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3ZM15 9c1 .8 1.5 1.8 1.5 3S16 14.2 15 15M17.5 7c1.7 1.3 2.5 3 2.5 5s-.8 3.7-2.5 5"/></svg><svg class="player-muted-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10v4h3l4 3V7l-4 3ZM16 10l4 4M20 10l-4 4"/></svg></button><input id="player-volume" class="player-range player-volume-range" type="range" min="0" max="100" value="70" aria-label="Volume" oninput="QuaverPlayer.setVolume(this.value)"/></div>
    <button class="player-close-btn" onclick="closePlayer()" aria-label="Close player" title="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>
</div>

<main class="profile-main">
  <div id="share-content" style="max-width:640px;margin:0 auto;width:100%;padding:0 20px;">
    <div class="loading" id="loading-state">
      <div class="loading-bar"></div>
      <span>loading playlist...</span>
    </div>
  </div>
</main>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
  let toastTimer;
  function showToast(message, type) { const toast=document.getElementById('toast'); clearTimeout(toastTimer); toast.textContent=message; toast.className='toast '+(type||'success')+' show'; toastTimer=setTimeout(function(){toast.classList.remove('show');},3200); }
  function applyTheme(theme) {
    const active = theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : theme;
    document.documentElement.setAttribute('data-theme', active);
    document.getElementById('logo').src = active === 'light' ? 'quaver_lightmode1.png' : 'quaver_nightmode1.png';
  }

  matchMedia('(prefers-color-scheme: light)').addEventListener('change', function() {
    if (!localStorage.getItem('theme')) applyTheme('system');
  });

  function playInApp(trackId, title, artist, albumArt) {
    return QuaverPlayer.play({ trackId: trackId, title: title, artist: artist || '', albumArt: albumArt || '' });
  }

  function closePlayer() {
    QuaverPlayer.hide();
  }

  async function loadSharedPlaylist() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('share-content');

    if (!id) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">No playlist specified.</p>';
      return;
    }

    try {
      const res = await fetch(API + '/api/playlist/public/' + id);
      if (!res.ok) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">This playlist is not available or has been made private.</p>';
        return;
      }
      const data = await res.json();
      const pl = data.playlist;
      const owner = data.owner;

      document.title = pl.name + ' - Quaver';

      let html = '<div style="margin-bottom:32px;">';
      html += '<div style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);opacity:0.6;margin-bottom:8px;">SHARED PLAYLIST</div>';
      html += '<h1 style="font-size:clamp(1.6rem,5vw,2.8rem);font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;">' + pl.name + '</h1>';
      html += '<div style="color:var(--text-muted);font-size:0.88rem;">' + pl.songs.length + ' songs · ' + pl.mood + ' · by <strong style="color:var(--text);">' + owner + '</strong></div>';
      html += '</div>';

      pl.songs.forEach(function(song, i) {
        const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
        html += '<div class="song-card">';
        html += '<span class="song-num">' + String(i + 1).padStart(2, '0') + '</span>';
        html += song.album_art ? '<img class="album-art" src="' + song.album_art + '" alt="art"/>' : '<div class="album-art"></div>';
        html += '<div class="song-info"><div class="song-title">' + song.title + '</div><div class="song-artist">' + song.artist + '</div></div>';
        html += '<div class="song-actions">';
        if (trackId) {
          html += '<button class="play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\', \'' + (song.artist || '').replace(/'/g, "\\'") + '\', \'' + (song.album_art || '') + '\')">&#9654;</button>';
        }
        html += '</div></div>';
      });

      html += '<div style="text-align:center;margin-top:40px;">';
      html += '<a href="Index.html" style="display:inline-block;padding:12px 28px;background:var(--gradient);color:#fff;border-radius:999px;text-decoration:none;font-weight:700;">Make your own playlist</a>';
      html += '</div>';

      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">Could not load playlist.</p>';
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    applyTheme(localStorage.getItem('theme') || 'system');
    loadSharedPlaylist();
  });
</script>
<script src="spotify-player.js"></script>
</body>
</html>
