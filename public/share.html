<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shared Playlist - Quaver</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="top-nav">
  <div class="nav-left">
    <a href="Index.html">
      <img class="logo" id="logo" src="quaver_nightmode1.png" alt="Quaver Logo">
    </a>
  </div>
  <div class="nav-center">
    <a class="nav-link" href="Index.html">Home</a>
  </div>
  <div class="nav-right">
    <button class="toggle" onclick="toggleTheme()">🌙</button>
  </div>
</nav>

<div id="spotify-player" class="spotify-player" style="display:none">
  <div class="player-header">
    <span id="player-song-name">—</span>
    <button class="player-close-btn" onclick="closePlayer()">✕</button>
  </div>
  <iframe id="spotify-iframe"
    style="border-radius:12px" src="" width="100%" height="80"
    frameborder="0" allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>
</div>

<main class="profile-main">
  <div id="share-content" style="max-width:640px;margin:0 auto;width:100%;padding:0 20px;">
    <div class="loading" id="loading-state">
      <div class="loading-bar"></div>
      <span>loading playlist...</span>
    </div>
  </div>
</main>

<script>
  const API = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';

  function toggleTheme() {
    const html = document.documentElement;
    const btn = document.querySelector('.toggle');
    const logo = document.getElementById('logo');
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    btn.textContent = isDark ? '☀️' : '🌙';
    logo.src = isDark ? 'quaver_lightmode1.png' : 'quaver_nightmode1.png';
    localStorage.setItem('theme', isDark ? 'light' : 'dark');
  }

  function playInApp(trackId, title) {
    document.getElementById('spotify-iframe').src = 'https://open.spotify.com/embed/track/' + trackId + '?utm_source=generator&theme=0&autoplay=1';
    document.getElementById('player-song-name').textContent = title;
    document.getElementById('spotify-player').style.display = 'block';
  }

  function closePlayer() {
    document.getElementById('spotify-iframe').src = '';
    document.getElementById('spotify-player').style.display = 'none';
  }

  async function loadSharedPlaylist() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('share-content');

    if (!id) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">No playlist specified.</p>';
      return;
    }

    try {
      const res = await fetch(API + '/api/playlist/public/' + id);
      if (!res.ok) {
        container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">This playlist is not available or has been made private.</p>';
        return;
      }
      const data = await res.json();
      const pl = data.playlist;
      const owner = data.owner;

      document.title = pl.name + ' - Quaver';

      let html = '<div style="margin-bottom:32px;">';
      html += '<div style="font-family:Space Grotesk,sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);opacity:0.6;margin-bottom:8px;">SHARED PLAYLIST</div>';
      html += '<h1 style="font-family:Space Grotesk,sans-serif;font-size:clamp(1.6rem,5vw,2.8rem);font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;">' + pl.name + '</h1>';
      html += '<div style="color:var(--text-muted);font-size:0.88rem;">' + pl.songs.length + ' songs · ' + pl.mood + ' · by <strong style="color:var(--text);">' + owner + '</strong></div>';
      html += '</div>';

      pl.songs.forEach(function(song, i) {
        const trackId = song.spotify_url ? song.spotify_url.split('/track/')[1] : null;
        html += '<div class="song-card">';
        html += '<span class="song-num">' + String(i + 1).padStart(2, '0') + '</span>';
        html += song.album_art ? '<img class="album-art" src="' + song.album_art + '" alt="art"/>' : '<div class="album-art"></div>';
        html += '<div class="song-info"><div class="song-title">' + song.title + '</div><div class="song-artist">' + song.artist + '</div></div>';
        html += '<div class="song-actions">';
        if (trackId) {
          html += '<button class="play-btn" onclick="playInApp(\'' + trackId + '\', \'' + song.title.replace(/'/g, "\\'") + '\')">&#9654;</button>';
        }
        html += '</div></div>';
      });

      html += '<div style="text-align:center;margin-top:40px;">';
      html += '<a href="Index.html" style="display:inline-block;padding:12px 28px;background:var(--gradient);color:#fff;border-radius:999px;text-decoration:none;font-weight:700;font-family:Quicksand,sans-serif;">Make your own playlist</a>';
      html += '</div>';

      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:60px 0;">Could not load playlist.</p>';
    }
  }

  window.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem('theme');
    const isDark = !saved || saved === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.querySelector('.toggle').textContent = isDark ? '🌙' : '☀️';
    document.getElementById('logo').src = isDark ? 'quaver_nightmode1.png' : 'quaver_lightmode1.png';
    loadSharedPlaylist();
  });
</script>
</body>
</html>
